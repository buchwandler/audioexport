name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to test, build, and publish (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Require a version tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          case "$RELEASE_TAG" in
            v*) ;;
            *) echo "Release tags must start with v" >&2; exit 1 ;;
          esac

  test:
    needs: validate-tag
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install FFmpeg (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install development environment
        run: python -m pip install -e '.[dev]'
      - name: Tests
        run: python -m pytest -q
      - name: Ruff
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy audioexport
      - name: Compile
        run: python -m compileall -q audioexport

  build:
    needs: [validate-tag, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install release tooling
        run: python -m pip install --upgrade build twine packaging
      - name: Build tagged distributions
        run: python -m build
      - name: Verify tag, metadata, wheel contents, and installed wheel
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          expected_version="${RELEASE_TAG#v}"
          python -m twine check dist/*
          python scripts/check_package_artifacts.py --expected-version "$expected_version"
      - uses: actions/upload-artifact@v4
        with:
          name: audioexport-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      # Configure this environment with required reviewers before enabling PyPI publishing.
      name: pypi
      url: https://pypi.org/project/audioexport/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: audioexport-distributions
          path: dist
      - name: Publish with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
