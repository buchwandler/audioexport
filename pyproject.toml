[build-system]
requires = ["setuptools>=80", "setuptools-scm>=9", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audioexport"
dynamic = ["version"]
description = "Standalone FFmpeg audio encoder with metadata, chapter, cover and reproducible export manifests"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "audioexport contributors"}]
keywords = ["ffmpeg", "audio", "mp3", "m4a", "flac", "m4b", "opus"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Sound/Audio",
  "Typing :: Typed",
]

dependencies = ["tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "build>=1", "mypy>=1.10", "twine>=5"]

[project.scripts]
audioexport = "audioexport.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["audioexport*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
audioexport = ["py.typed"]

[tool.setuptools_scm]
fallback_version = "0.1.0.dev0"
version_file = "audioexport/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["*.md"]


[tool.mypy]
python_version = "3.11"
strict = true
files = ["audioexport"]
