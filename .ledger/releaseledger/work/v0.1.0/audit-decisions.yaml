    observed_behavior: |
      Provides an independent Python API and CLI for FFmpeg-based audio export across WAV, FLAC, MP3, M4A, M4B, OGG, and Opus. Supports metadata, validated chapter timelines, optional cover art, FFprobe verification, content-addressed export identities, reusable sidecar manifests, and safe output handling without importing Readio or synthesis engines. The public errors, examples, migration boundary, and tests document the standalone contract.
    public_impact: public
    decision: accepted
    target_entry_key: null
