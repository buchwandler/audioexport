    observed_behavior:
      "Reviewed the patch and tests: bundle workspaces now expose a
      read-only variant inventory and can export every discovered variant in deterministic
      name order with variant-separated outputs, while explicit single-variant export
      remains supported. Batch option validation occurs before discovery, export fails
      fast without deleting prior outputs, and the public CLI/API expose the new inventory
      and batch result types. Document compose reports now accept nested output_geometry
      tables and legacy flat geometry, while rejecting invalid or contradictory layouts.
      Documentation and regression tests cover the new behavior."
