    section_hash: 604ca2daab1d007e3a508c4ec27d4318eeeb5f6ea721418839b572f3acbc4ade
    summary: audioexport
    text: "# audioexport


      An independent Python library and command-line interface for exporting audio through
      **FFmpeg**. This is the first extraction step from Readio's output/encoding subsystem,
      but **audioexport does not import or install Readio, AudioCompose, UtterPlan,
      or synthesis engines**.


      Supported formats: WAV (PCM16), FLAC, MP3, M4A (AAC), M4B (AAC audiobook), OGG
      (Vorbis), and Opus. Handles tagged metadata, embedded JPEG/PNG cover art for MP3/M4A/M4B,
      JSON chapter timelines for M4A/M4B, standalone ordered multi-track audiobook assembly,
      FFprobe verification, artifact identities and safe reuse."
    links: []
