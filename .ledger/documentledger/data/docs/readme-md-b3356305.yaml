    section_hash: d5987b5dd0489442f66aeed4c1792168ecfe848951015ccb4822cdd639fd01e6
    summary: Limitations (MVP)
    text: "## Limitations (MVP)


      No audio mastering, TTS, audio mixing, streaming PCM API, FFmpeg filter graphs,
      network service, or GUI. No automatic conversion of Readio project configs, legacy
      export cache, or Audiocompose timeline semantics other than chapter starts. Encoder
      output may vary across FFmpeg versions; the cache key includes tool versions.
      Chapter verification has a small tolerance for FFmpeg container timebase rounding.
      Standalone encoding does not modify Readio projects."
