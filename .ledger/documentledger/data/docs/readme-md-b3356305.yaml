    section_hash: 9e477aa39b07b49eb06bb58abd2364eac675ae065fe5b4105ad6be20e443bd83
    summary: Install
    text: "## Install


      Requirements: **Python 3.10+** and external **FFmpeg + FFprobe** executables available
      on `PATH`. Install a build containing the encoders you need: `pcm_s16le`, `flac`,
      `libmp3lame`, `aac`, `libvorbis` (or native `vorbis`), and/or `libopus`.


      Platform notes:


      - Ubuntu/Debian: `sudo apt-get install ffmpeg`.

      - macOS: `brew install ffmpeg`.

      - Windows: install a current FFmpeg build and add its `bin` directory to `PATH`.


      ```bash

      python -m pip install audioexport

      python -m audioexport --version

      # Or install from a checkout:

      python -m pip install -e .

      audioexport doctor --json

      ```


      `doctor` reports package/tool versions and encoder availability per format. Its
      existing `ready` key means FFmpeg and FFprobe are present; `all_formats_ready`
      and each `formats` entry report encoder capability and a reason when unavailable.
      The additive `features` entries report `m4b_encode`, `m4b_audiobook`, and `m4b_stream_copy`
      availability; missing optional capabilities do not make `ready` false. `run_profile()`
      checks the encoders selected by the profile before writing outputs.


      The only base Python dependency is `tomli` on Python 3.10. FFmpeg/FFprobe are
      external executables; AudioExport does not install or import Readio, AudioCompose,
      UtterPlan, VoiceRender, soundfile, or NumPy."
    links: []
