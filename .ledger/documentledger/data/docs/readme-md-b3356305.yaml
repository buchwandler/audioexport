      - 124
    section_hash: db1fcd2e1f9ac033a73a6ad84b9d81de61f3598d0ee35b03f1a2d14813a4e11e
    summary: Standalone audiobook assembly
    text:
      "## Standalone audiobook assembly\n\n`encode` converts one already-prepared\
      \ audio source to a format; it does not merge a collection of source tracks. Use\
      \ the separate `audiobook` workflow when starting from ordered tracks or a directory:\n\
      \n```bash\n# Direct directory input: immediate audio files only, natural filename\
      \ ordering.\naudioexport audiobook book-tracks/ -o book.m4b \\\n  --title \"My\
      \ Book\" --author \"Author Name\" --album \"My Book\" --cover cover.jpg\n\n# Or\
      \ provide an explicit order; source title tags become chapter titles when present.\n\
      audioexport audiobook 01-intro.mp3 02-chapter-one.flac 03-chapter-two.wav \\\n\
      \  -o book.m4b --bitrate 96k --language eng\n\n# Explicit chapter starts from\
      \ chapters.txt or the existing JSON/Readio timeline format.\naudioexport audiobook\
      \ book-tracks/ -o book.m4b --chapters-file chapters.txt\n```\n\nEach source track\
      \ becomes one chapter by default. Chapter starts use normalized segment durations;\
      \ titles prefer an explicit `AudiobookTrack` title, then the source title tag,\
      \ then the filename stem. Tracks are serially normalized to common AAC settings,\
      \ concatenated with stream copy, and final-muxed without a second audio encode.\
      \ Sample rate and channel count default from the first track; only mono/stereo\
      \ targets are supported. The audiobook command defaults to the FFmpeg-compatible\
      \ `media_type=2` tag. `--author` (or its `--artist` alias) writes the player-compatible\
      \ `artist` tag; `--album-artist`, `--writer`, and `--long-description` map to\
      \ `album_artist`, `composer`, and `synopsis`. `--metadata KEY=VALUE` adds or overrides\
      \ an FFmpeg tag.\n\nFor one directory input, the CLI discovers `cover.jpg`, then\
      \ `cover.jpeg`, then `cover.png`, plus `chapters.txt`, when explicit resources\
      \ were not supplied. Discovered names appear in command output and the audiobook\
      \ manifest. Use `--no-auto-sidecars` to disable this behavior. The library API\
      \ does not scan sibling files unless called with `discover_sidecars=True`.\n\n\
      Python callers can use the same assembly workflow without invoking the CLI:\n\n\
      ```python\nfrom audioexport import AudiobookMetadata, AudiobookTrack, build_audiobook\n\
      \nresult = build_audiobook(\n    [\n        AudiobookTrack(\"01-intro.mp3\", title=\"\
      Introduction\"),\n        \"02-chapter-one.flac\",\n    ],\n    \"book.m4b\",\n\
      \    metadata=AudiobookMetadata(title=\"My Book\", author=\"Author Name\"),\n\
      \    cover=\"cover.jpg\",\n)\nprint(result.track_count, result.chapter_count,\
      \ result.reused)\n```\n\nA separate `audioexport.audiobook.v1` profile describes\
      \ ordered inputs and explicit resources. All relative paths resolve from the profile\
      \ file; no glob or implicit directory expansion is used in TOML. `chapters_file`\
      \ is a top-level resource path, while `[chapters]` selects its mode:\n\n```toml\n\
      schema = \"audioexport.audiobook.v1\"\noutput = \"My Book.m4b\"\ninputs = [\"\
      01 Intro.mp3\", \"02 Chapter One.flac\"]\ncover = \"cover.jpg\"\nchapters_file\
      \ = \"chapters.txt\"\n\n[audio]\nbitrate = \"96k\"\nsample_rate = 44100\nchannels\
      \ = 2\n\n[metadata]\ntitle = \"My Book\"\nauthor = \"Author Name\"\nalbum = \"\
      My Book\"\ngenre = \"Audiobook\"\nlanguage = \"eng\"\n\n[chapters]\nmode = \"\
      explicit\"       # tracks | explicit | none\n# title_source = \"tag\"  # tag (falls\
      \ back to filename) | filename\n```\n\nRun it with `audioexport audiobook --profile\
      \ audiobook.toml`. CLI `--output`, metadata, audio settings, cover, and `--chapters-file`\
      \ override profile values; the TOML input order remains authoritative. `mode =\
      \ \"tracks\"` (the default) creates one chapter per track; `mode = \"explicit\"\
      ` requires `chapters_file`; `mode = \"none\"` disables chapters. Existing `encode(...,\
      \ format=\"m4b\", timeline=...)` remains the right choice for Readio's prepared\
      \ master and project timeline.\n\nIf `--output` is not set for `encode`, the output\
      \ filename defaults to the input stem and chosen format. To avoid destroying the\
      \ input, encoding input and output to the same real path is always rejected.\n\
      \nWithout `--force`, an untracked, symlink, or manually modified output is never\
      \ overwritten. A previously generated output is updated when its sidecar and checksum\
      \ still match; re-running identical options returns `reused: true` without re-encoding.\
      \ `--force` authorizes replacing an unknown or modified regular file, but symlink\
      \ outputs and sidecars are always rejected. Writes are staged with their manifest;\
      \ a failed manifest commit restores the last good pair when possible, and an incomplete\
      \ recovery reports the preserved backup path. A per-target process lock rejects\
      \ concurrent writers with `audioexport.output_busy`; remove a stale lock only\
      \ after confirming no writer is active.\n\nOGG defaults to Vorbis quality-based\
      \ encoding (`-qscale:a 4`) to avoid low-rate/mono bitrate incompatibilities. `--bitrate`\
      \ accepts values such as `192k`, `192000`, or `1M`; whitespace is trimmed. A bare\
      \ integer is interpreted as **bits per second**, so use `192k` (or `192000`),\
      \ not `192`, for a nominal 192 kb/s rate. WAV/FLAC don't accept bitrate. WAV output\
      \ is always PCM16 conversion, not a byte-for-byte passthrough; lossy codecs and\
      \ even PCM output can vary with FFmpeg versions, which are included in the export\
      \ identity."
