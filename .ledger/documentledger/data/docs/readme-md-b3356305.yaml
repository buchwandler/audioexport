    section_hash: b711072f4350e835c0e467b2ccaac224d72131ec0ada1355c5337a624d885d92
    summary: Readio migration
    text: "## Readio migration


      **Readio is deliberately not patched by this project.** Its existing export commands
      continue using their current code until an opt-in bridge is tested. A future integration
      must call AudioExport's Python library API; it must never launch the `audioexport`
      CLI as a subprocess. See [`docs/readio-migration.md`](docs/readio-migration.md)
      for the compatibility boundary, integration order, and rollback rules. Readio
      continues owning project locks, path defaults, staleness, indexed state, and orchestration."
    links: []
