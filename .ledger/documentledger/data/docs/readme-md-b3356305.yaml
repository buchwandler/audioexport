    section_hash: 1a79beb70f550e93685237324ecec59160da3b00907c3374c12d5fb399df8a36
    summary: CLI quickstart
    text:
      "## CLI quickstart\n\n```bash\n# Creates demo.wav in the current directory\
      \ (or use your own audio file):\npython examples/create_demo_wav.py\n# Any FFmpeg-decodable\
      \ audio source is accepted.\naudioexport encode demo.wav --format mp3 -o output.mp3\
      \ --bitrate 192k\naudioexport encode demo.wav --format flac -o output.flac\naudioexport\
      \ encode demo.wav --format m4a -o output.m4a --title \"My recording\" --artist\
      \ \"An author\"\naudioexport encode demo.wav --format ogg -o output.ogg\naudioexport\
      \ encode demo.wav --format opus -o output.opus\n\naudioexport inspect output.mp3\
      \ --json\naudioexport doctor --json\n\n# For M4B chapters; use your own cover.jpg\
      \ or omit --cover:\naudioexport encode demo.wav --format m4b -o mybook.m4b \\\n\
      \  --title \"My Book\" --artist \"An Author\" \\\n  --timeline examples/chapters.json\
      \ --cover cover.jpg --bitrate 192k\n\n# Export multiple formats at once using\
      \ an editable profile:\naudioexport run demo.wav --profile examples/export.toml\
      \ --out-dir exported/ --json\n```"
    links: []
  - section_id: md:section:README.md::standalone-audiobook-assembly
    doc_path: README.md
