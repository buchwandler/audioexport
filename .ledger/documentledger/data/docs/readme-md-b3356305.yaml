    section_hash: 739097fa8d2953b28f8b51f5c06952f9ef7aade861e0da06df1b4a6ebf3765c6
    summary: Chapters/timeline
    text:
      "## Chapters/timeline\n\nUse an independent JSON file such as [`examples/chapters.json`](examples/chapters.json):\n\
      \n```json\n{\n  \"chapters\": [\n    { \"title\": \"Intro\", \"start_ms\": 0 },\n\
      \    { \"title\": \"Part One\", \"start_ms\": 60000 }\n  ]\n}\n```\n\n`end_ms`\
      \ is optional; without it, chapter ends are the next chapter start or the audio\
      \ duration. Chapter offsets must be strictly increasing and within the audio file.\
      \ FFmpeg metadata escaping is handled internally. Embedded chapter markers are\
      \ currently supported for **M4A and M4B**.\n\nFor an incremental Readio migration,\
      \ the same `--timeline` API also reads **Readio's `readio.composition-timeline`\
      \ JSON** with `sample_rate` and chapter `start_sample`. FFmetadata is constructed\
      \ with its original sample timebase for precision, with generic millisecond chapter\
      \ fields available for non-Readio workflows."
    links: []
