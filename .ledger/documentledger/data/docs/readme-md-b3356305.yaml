    section_hash: 8b39e043aaaaef7d5a974f3e0ff9dad2476d3a1303022dcc236a0ab094a1bdfa
    summary: Export profile
    text: '## Export profile


      [`examples/export.toml`](examples/export.toml) is a complete seven-format example.
      The `audioexport.profile.v1` schema keeps profile-wide `cover`, `timeline`, and
      `[metadata]`, while each `[[outputs]]` row may add `use_cover` and `use_chapters`:


      ```toml

      schema = "audioexport.profile.v1"

      timeline = "chapters.json"  # resolved relative to this TOML

      # cover = "cover.jpg"        # optional; uncomment and provide the file


      [metadata]

      title = "My audiobook"

      artist = "An author"

      album = "My audiobook"


      [[outputs]]

      format = "mp3"

      bitrate = "192k"

      use_cover = false

      use_chapters = false


      [[outputs]]

      format = "flac"

      use_cover = false

      use_chapters = false


      [[outputs]]

      format = "m4a"

      bitrate = "192k"

      use_chapters = true


      [[outputs]]

      format = "m4b"

      bitrate = "192k"

      use_chapters = true


      [[outputs]]

      format = "ogg"


      [[outputs]]

      format = "opus"

      bitrate = "96k"


      [[outputs]]

      format = "wav"

      ```


      When a selector is omitted (`None`), configured global artwork is attached automatically
      only to MP3/M4A/M4B, and chapters only to M4A/M4B; unsupported formats skip those
      global resources. `true` requires the resource and a capable format; `false` suppresses
      it. For example, to enable artwork, set a valid top-level `cover` and `use_cover
      = true` on the MP3/M4A/M4B rows. Direct `encode()` calls remain strict: unsupported
      cover/chapter arguments are errors.


      `run_profile()` validates every row, resource, capability, and concrete filename
      collision before the first encode, then returns results in TOML order. Resource
      paths are relative to the profile file. Explicit `filename` values are literal
      simple filenames with the matching extension; no template expansion or nested
      paths are supported. If omitted, each filename uses the input stem. Profile-wide
      metadata is inherited by every output; there is no per-output metadata override.'
    links: []
  - section_id: md:section:README.md::profile-resolution-and-read-only-preflight-api
    doc_path: README.md
    heading_path:
      - audioexport
      - Profile resolution and read-only preflight API
    heading_slug: profile-resolution-and-read-only-preflight-api
    line_span:
      - 208
      - 245
    section_hash: ff96bbcad7d696b6006ed91c0d43bc99dce406acf6564bd09b7dff109318f8ab
    summary: Profile resolution and read-only preflight API
    text:
      "## Profile resolution and read-only preflight API\n\nThe `audioexport.profile.v1`\
      \ `use_cover` and `use_chapters` fields select profile-wide resources for each\
      \ output. An omitted selector (`None`) uses a configured resource only when the\
      \ format supports it; `false` suppresses it; `true` requires both a configured\
      \ resource and a supporting format. Automatic selection is:\n\n| Formats     \
      \         | Cover by default   | Chapters by default |\n| --------------------\
      \ | ------------------ | ------------------- |\n| WAV, FLAC, OGG, Opus | No  \
      \               | No                  |\n| MP3                  | Yes, if configured\
      \ | No                  |\n| M4A, M4B             | Yes, if configured | Yes,\
      \ if configured  |\n\n`ResolvedOutput` is an immutable description containing\
      \ normalized format, literal filename, effective normalized bitrate, and selected\
      \ cover/timeline paths. Explicit filenames are simple filenames with a matching\
      \ extension and are never interpolated; only an omitted filename uses the supplied\
      \ source stem. `resolve_output(profile, spec, source_stem)` is a pure operation\
      \ on an already-loaded profile and does not probe media or read the TOML again.\n\
      \nUse `preflight_profile()` when the complete profile must be proven ready before\
      \ the first output write. It returns the resolved outputs in TOML order, checks\
      \ the source, metadata, selected resources and chapters, FFmpeg/FFprobe, and only\
      \ the requested encoders. It does not accept an output directory and creates no\
      \ outputs, directories, manifests, or temporary files. An unused global resource\
      \ (for example, a missing cover on a FLAC-only profile) is not validated.\n\n\
      ```python\nfrom pathlib import Path\nfrom audioexport import encode, load_profile,\
      \ preflight_profile\n\nsource = Path(\"master.wav\")\nprofile = load_profile(\"\
      export.toml\")  # Load once.\nresolved_outputs = preflight_profile(profile, source)\n\
      \nfor resolved in resolved_outputs:\n    target = Path(\"exports\") / resolved.filename\n\
      \    # A consumer such as Readio performs its target/ownership/overwrite checks\
      \ here.\n    result = encode(\n        source,\n        target,\n        format=resolved.format,\n\
      \        bitrate=resolved.bitrate,\n        metadata=profile.metadata,\n     \
      \   cover=resolved.cover,\n        timeline=resolved.timeline,\n    )\n```\n\n\
      A consumer may instead call `resolve_output()` for a single selected spec; use\
      \ full-profile preflight when the operation requires every configured output validated.\
      \ Preflight is not an ownership authorization: Readio remains responsible for\
      \ project locks and freshness, destination selection and collision/ownership checks,\
      \ overwrite authorization, state/index updates, result types, and partial-batch\
      \ bookkeeping. Call `encode()` only after those consumer-owned checks pass. `ResolvedOutput`,\
      \ `resolve_output`, and `preflight_profile` are available from both `audioexport`\
      \ and `audioexport.api`."
    links: []
