    summary: Tests
    text: "## Tests


      ```bash

      python -m pip install -e '.[dev]'

      python -m pytest -q

      ruff check .

      ruff format --check .

      mypy audioexport

      python -m compileall -q audioexport

      python -m build

      python -m twine check dist/*

      python scripts/check_package_artifacts.py

      audioexport doctor --json

      ```


      Tests cover seven real formats in one profile, mixed-format audiobook assembly,
      100-track ordering/chapters, audiobook cache invalidation, M4A/M4B chapters and
      covers, Readio sample timelines, malformed probes, encoder availability, transactional
      failure recovery, no-clobber behavior, and concurrent writers. CI runs Python
      3.10 and 3.13 on Linux, Windows, and macOS, and checks lint, formatting, typing,
      build metadata, Twine, package contents, and an isolated wheel install outside
      the checkout. Cross-platform encoder availability still depends on the FFmpeg
      build installed by the runner."
