    section_hash: 849d2f23bb6ec293ed37c9555a4ae3c4c1d77f244e4c4972d4e095de41b5afc7
    summary: Integrity and versioning
    text: "## Integrity and versioning


      `encode()` and `run_profile()` outputs have a sibling sidecar, for example `output.mp3.audioexport.json`,
      holding `audioexport.manifest.v1`, a SHA-256 export identity, source/output and
      consumed-resource digests, tool versions, normalized options, chapter mapping,
      and the probed output summary. `build_audiobook()` uses the same sidecar path
      with `audioexport.audiobook-manifest.v1`, recording ordered tracks, consumed resources,
      normalized settings, resolved chapter structure, tools, and verification. Generic
      export identity is **input-content + relevant options/resources + tools**, not
      output location or TOML formatting. The original sources are never modified.


      Encoding uses argument-vector subprocess calls (`shell=False`) and stages both
      audio and manifest before committing. The output lock serializes same-target writers
      across processes; a competing call receives a typed busy error. If a sidecar commit
      fails, the previous output/manifest are restored when possible. A recovery failure
      retains its backup and refuses to treat a mismatched sidecar as current; inspect
      the reported recovery path before retrying. FFprobe validation checks the single
      audio stream, codec, duration, requested tags/chapters, and cover codec/disposition.


      Version is dynamic through `setuptools-scm`: `pyproject.toml` has no static `version`
      field, and Git tags determine wheel/sdist metadata, `audioexport.__version__`,
      and CLI output. The project supports Python 3.10+ and retains the flat `audioexport/`
      layout. Unversioned archives use a development fallback; a fallback build must
      never be treated as final `0.1.0`.


      For a release, first commit the code and wait for the complete Linux/Windows/macOS,
      Python 3.10/3.13 CI matrix. Then create and push the intended version tag (for
      example `v0.1.0`). Manually dispatch `.github/workflows/release.yml` with that
      existing tag. It reruns the test matrix, checks the tag against wheel/sdist metadata,
      inspects package contents, installs the wheel outside the checkout, and checks
      CLI/API version parity. Publishing uses PyPI trusted publishing only after the
      `pypi` GitHub environment is approved; repository administrators must configure
      required reviewers for that environment and register the trusted publisher on
      PyPI. Do not publish from an untagged/fallback build."
    links: []
