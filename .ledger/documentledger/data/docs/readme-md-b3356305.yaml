    section_hash: 74e70cb7a176d6575daba94555e153509174523b60bdd0f7d4554d381b4e746c
    summary: Python API
    text:
      "## Python API\n\n```python\nimport audioexport\nfrom pathlib import Path\n\
      from audioexport import Chapter, encode, run_profile, doctor, probe\n\nresult\
      \ = encode(\n    Path(\"master.wav\"),\n    Path(\"exported/book.m4b\"),\n   \
      \ format=\"m4b\", bitrate=\"192k\",\n    metadata={\"title\": \"My Book\", \"\
      artist\": \"Author Name\"},\n    cover=Path(\"cover.jpg\"),\n    chapters=[\n\
      \        Chapter(\"Introduction\", start_ms=0),\n        Chapter(\"Chapter One\"\
      , start_ms=60_000),\n    ],\n)\nprint(result.to_dict())\n\nfor other in run_profile(\"\
      master.wav\", \"examples/export.toml\", \"exported\"):\n    print(other.path,\
      \ other.reused)\n\nprint(audioexport.__version__)\ndiagnostics = doctor()\nprint(diagnostics[\"\
      ready\"], diagnostics[\"all_formats_ready\"])\nprint(probe(\"exported/book.m4b\"\
      )[\"chapters\"])\n```\n\nYou may import the same public functions from `audioexport.api`\
      \ as well as from `audioexport`.\n\nThe public errors are `AudioExportError` and\
      \ subclasses `InvalidExportError`, `ToolNotFoundError`, `EncodingError`, and `VerificationError`,\
      \ with a stable machine-readable `.code` value. `encode()` returns an immutable\
      \ `ExportResult`; `build_audiobook()` returns an `AudiobookResult` with track/chapter\
      \ counts and verified duration. Both APIs include identity, path, checksum, and\
      \ reuse state, and work without a Readio project."
