    section_hash: 0400a7ac8f0ab94d0b40127ce1f835651f64c8320838362b9b19acc44c7a1adc
    summary: Acceptance gates before switching Readio by default
    text: "## Acceptance gates before switching Readio by default


      - All 7 standalone formats encode in CI and produce correct probed codec.

      - M4B chapter order/title/starts/ends, cover, and author/title tags survive.

      - Changes to bitrate/title/cover affect export only, and unchanged exports are
      reusable.

      - Readio's `export`, `audiobook export`, and `speak` old signatures, errors,
      project indexes, and project state survive.

      - No circular dependencies; last-good project remains readable/resumable."
