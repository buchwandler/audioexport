    section_hash: cc8fd3f855095570fac5b7387fb3f06a65968c8b7d07e2b327fb0ec4550c7024
    summary: Next PR, in the Readio repository
    text: "## Next PR, in the Readio repository


      1. Capture golden baseline for `readio export` (WAV/FLAC/MP3/M4A/OGG/Opus), `readio
      audiobook export` (M4B metadata/chapters/cover), `readio speak --format`, cache/status/force;
      verify existing test suites.

      2. Publish an installable audioexport release; pin an explicitly tested version
      range in Readio, initially via an optional `audioexport` extra or mandatory dep
      only when stabilized.

      3. Add a **feature-flagged bridge**, e.g. environment/config `READIO_AUDIOEXPORT=1`.
      Leave default/legacy execution untouched initially. The bridge's only encoding
      operation is `audioexport.encode(...)` from Python, **not a subprocess invocation
      of `audioexport` CLI**.

      4. In `readio/stages/export.py`, load the `audioexport.profile.v1` once and call
      `preflight_profile(profile, master, ffmpeg=..., ffprobe=...)` before any export
      write. Preflight returns `ResolvedOutput` values in TOML order, but has no destination/output-directory
      input and does not write or authorize replacement. For each selected output, Readio
      chooses its target and performs its own project freshness, collision/ownership/provenance,
      overwrite-authorization, lock, and state checks before calling `encode()` with
      the resolved format, bitrate, profile metadata, cover, and timeline. Readio then
      updates its own state/index/result. A single-spec operation may use `resolve_output()`;
      use full preflight when all configured outputs must validate.

      5. In `readio/stages/audiobook_export.py`, retain `prepare_audiobook_export()`
      and its project freshness checks. If the bridge uses an `audioexport.profile.v1`
      profile for the prepared master, load it once and preflight its complete output
      list before writing; Readio still performs its own target-ownership and overwrite
      checks before encoding. Pass the resolved timeline, cover, effective bitrate,
      and profile metadata along with `prepared.master` to `encode()`. Preserve Readio's
      title/author mapping, error-code translations, and return fields, including `chapter_count`.

      6. Keep the old encoding path for `speak --format` until stream/buffer parity
      is explicitly addressed: `audioexport.encode()` consumes an **existing file**,
      whereas `readio/wave.py` currently also supports **PCM streaming**. An intermediate
      temporary WAV adapter can work but should be isolated/tested, not silently forced
      on the live path.

      7. Run the existing Readio format, export, audiobook, CLI, API and project-state
      test suites. On parity, enable the flag progressively, then deprecate the redundant
      encoding implementation in a later PR. Rollback = feature flag off; never delete
      last-good artifacts."
    links: []
