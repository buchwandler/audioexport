    section_hash: 85bacb47951b02bcdd9c380247d4c9668958d1eb0be34a7b5706942fdb3362e5
    summary: What was extracted/adapted
    text: "## What was extracted/adapted


      | Readio source                                                                                    |
      Independent implementation                                                             |
      Kept in Readio for now                                                                                               |

      | ------------------------------------------------------------------------------------------------
      | --------------------------------------------------------------------------------------
      | --------------------------------------------------------------------------------------------------------------------
      |

      | `readio/formats.py` format mappings + capability checks                                          |
      `audioexport/formats.py`, `audioexport/fftools.py` explicit FFmpeg mapping, `doctor()`
      | Readio's original public format detection and messages                                                               |

      | `readio/wave.py` FFmpeg sink for M4A/Opus                                                        |
      `audioexport/pipeline.py` file-to-file FFmpeg argv encoding, all codecs                |
      Readio's streaming PCM sink and live `speak` path                                                                    |

      | `readio/stages/export.py` bitrate normalization, export ID, output replacement                   |
      `audioexport/formats.py` bitrate; `pipeline.py` own export identity and sidecars       |
      `readio.export-state`, project lock, existing export identity and cache index                                        |

      | `readio/stages/audiobook_export.py` metadata escaping, timeline chapters, M4B
      command and checks | `audioexport/chapters.py`, `audioexport/pipeline.py` FFmetadata/M4B/cover/FFprobe      |
      Readio's audiobook metadata defaults, project & timeline freshness checks, cover
      selection, audiobook-state identity |


      The new independent package is not a verbatim file move: generic FFmpeg/chapter
      logic was adapted and decoupled from `Project`, `soundfile`, `numpy`, `audiocompose`,
      and Readio exception classes. M4B chapter timelines can be read as-is, without
      importing Readio."
