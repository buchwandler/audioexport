    summary: Current state
    text: "## Current state


      **No existing Readio files are changed by this archive**. In particular, no import
      from `readio` appears in `audioexport/`. There is no dependency from `audioexport`
      to UtterPlan, AudioCompose, VoiceRender, or Readio. Readio still owns its complete
      legacy fallback; switching it to this exporter is an intentionally separate step."
    links: []
