    section_hash: eb21f5ba6dec789af00d84c881c37d9d9a4397a8a3d35532b7f7c12ab18e23e1
    summary: Differences to preserve or accept deliberately
    text: "## Differences to preserve or accept deliberately


      - Readio's generic MP3/FLAC/OGG were written using `soundfile`; AudioExport uses
      FFmpeg for all encoders, so bitstreams and encoder provenance differ (expected).
      Tests should compare format, basic audio duration/properties, metadata and semantic
      chapter times, not exact bytes.

      - Readio's bitrate CLI historically supports only M4A and Opus for generic `export`;
      AudioExport also supports MP3, OGG and M4B. Keep old Readio validation on the
      bridge until changing Readio's public contract deliberately.

      - AudioExport's `audioexport.manifest.v1` is independent of Readio `readio.export-state`,
      and its identity includes source hashes, metadata/cover/chapters and FFmpeg/FFprobe
      version. Readio must not mistake the new sidecar for the old project index.

      - A Readio sample-based timeline is supported, but its original project plan/metadata
      IDs are intentionally not validated outside Readio.

      - Export-only change never triggers voice synthesis or composition. Readio's
      current project-level freshness must remain the source of truth."
    links: []
