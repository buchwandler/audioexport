    section_hash: 9f4b123e87b2cc297ff6631ad04f36d6a2fbe3ef292b5ae91f7fff6b137e1ce9
    summary: Profile-based bridge shape (illustrative, not a drop-in patch)
    text:
      "## Profile-based bridge shape (illustrative, not a drop-in patch)\n\n```python\n\
      from pathlib import Path\nfrom audioexport import encode, load_profile, preflight_profile\n\
      \n# Load the profile once, then prove all configured outputs are encodable before\
      \ writing.\nprofile = load_profile(profile_path)\nresolved_outputs = preflight_profile(\n\
      \    profile,\n    master,\n    ffmpeg=ffmpeg,\n    ffprobe=ffprobe,\n)\n\nfor\
      \ resolved in resolved_outputs:\n    target = Path(readio_destination) / resolved.filename\n\
      \n    # Readio-owned checks happen after read-only preflight and before encode:\n\
      \    # freshness, project lock, destination collision/ownership, provenance,\n\
      \    # overwrite authorization, and state policy.\n    result = encode(\n    \
      \    master,\n        target,\n        format=resolved.format,\n        bitrate=resolved.bitrate,\n\
      \        metadata=profile.metadata,\n        cover=resolved.cover,\n        timeline=resolved.timeline,\n\
      \        force=readio_authorized_replace,\n        ffmpeg=ffmpeg,\n        ffprobe=ffprobe,\n\
      \    )\n\n    # Readio stores its own state/index/result after each successful\
      \ encode.\n```\n\n`preflight_profile()` never takes an output directory or chooses\
      \ a target. It validates the complete loaded profile without creating audio, manifests,\
      \ temporary files, or directories. A caller can instead call `resolve_output(profile,\
      \ spec, source_stem)` when it only needs one selected output's effective settings;\
      \ it still must run the appropriate Readio checks before writing.\n\n**Important\
      \ nuance:** For `readio export` with a tracked file that has changed inputs, using\
      \ a new sidecar for the first time means the target appears untracked to audioexport.\
      \ While bridging, Readio must explicitly authorize replace by passing `force=True`\
      \ **only after Readio's own ownership check**; this applies even when its existing\
      \ `force` flag was false. Never broaden replacement for arbitrary external targets.\n\
      \nFor M4B the existing Readio source validates `composition-state` against master/timeline\
      \ digests before export. AudioExport validates chapter JSON and media, but it\
      \ deliberately does not know the Readio project state. Those validations must\
      \ remain in Readio's wrapper."
    links: []
